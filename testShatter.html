<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UNM CS 512 HW 1 Test Glass Shatter Generator</title>
    <script type="text/javascript" src="./glass.js"></script>
  </head>

  <body>
    <h2>Testing Shatter Generator</h2>
    <canvas id="result"></canvas>
    <script>
      function renderShatter() {
        shatteredFaces = shatterFaces(10, 10, undefined, 20, 1);

        const canvas = document.getElementById("result");
        const ctx = canvas.getContext("2d");

        const scale = 40;
        canvas.width = 10 * scale;
        canvas.height = 10 * scale;

        shatteredFaces.forEach((face) => {
          if (!face) {
            return;
          }

          // form the face path
          ctx.beginPath();
          ctx.moveTo(face[0][0] * scale, face[0][1] * scale);
          for (let i = 1; i < face.length; i++) {
            ctx.lineTo(face[i][0] * scale, face[i][1] * scale);
          }
          ctx.closePath();

          // fill with color
          ctx.fillStyle = `rgb(${Math.floor(Math.random() * 255)},${Math.floor(Math.random() * 255)},${Math.floor(Math.random() * 255)})`;
          ctx.fill();

          ctx.lineWidth = 1.5;
          ctx.strokeStyle = "#000";
          ctx.stroke();
        });
      }

      renderShatter();
      setInterval(renderShatter, 1000);
    </script>
  </body>
</html>
